<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sticker Board</title>
  <meta name="theme-color" content="#fff6ea">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Stickers">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app"><p class="starting">🧪</p></div>
  <div id="modal" hidden></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script>
    // If the app fails to start (or is still not up after 20 seconds), show a way out instead of a blank screen.
    // "Reload" clears the saved copy of the app's files (not the board's data), then loads them fresh.
    (function () {
      function fail() {
        if (window.__appStarted) return;
        var app = document.getElementById('app');
        if (!app || app.querySelector('.start-fail')) return;
        app.innerHTML =
          '<main class="start-fail"><div class="panel center">' +
          '<p class="start-emoji">🧪</p><h2>The sticker board didn’t load</h2>' +
          '<p class="hint">Check the internet connection, then tap Reload. Your stickers are safe.</p>' +
          '<button class="btn" id="start-reload">Reload</button></div></main>';
        // Only throw away the saved copy once a fresh one has actually downloaded. Offline, the saved copy
        // is all there is, so then just try again.
        document.getElementById('start-reload').onclick = function () {
          var fresh = navigator.onLine ? fetch('./', { cache: 'no-store' }).then(function (r) { if (!r.ok) throw r; }) : Promise.reject();
          fresh
            .then(function () { return window.caches ? caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }) : null; })
            .catch(function () {})
            .then(function () { location.reload(); });
        };
      }
      window.addEventListener('error', function (e) {
        if (e instanceof ErrorEvent || (e.target && e.target.tagName === 'SCRIPT')) fail();
      }, true);
      window.addEventListener('unhandledrejection', fail);
      setTimeout(fail, 20000);
    })();
  </script>
  <script type="module" src="app.js"></script>
</body>
</html>
